name: CI
on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译验证：模拟器免签名构建，证明这份源码树能完整编过。
  # 安装到真机需要自己的证书与描述文件，不在 CI 内做。
  build:
    name: build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # README 要求 Xcode 27；runner 默认版本随时间漂移，这里显式选最高版本。
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          CANDIDATE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CANDIDATE" ]; then echo "no Xcode on this runner"; exit 1; fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          # 与 Dependencies.lock.json 所钉内核的 go.mod 工具链指令一致
          go-version: '1.26.6'

      - name: Install XcodeGen and PyYAML
        # runner 的 Homebrew Python 是 externally-managed，pip 直装会被拒；
        # 按项目 README 的约定用 .build/python-env 虚拟环境。
        run: |
          brew install xcodegen
          python3 -m venv .build/python-env
          .build/python-env/bin/pip install --upgrade PyYAML
          xcodegen --version
          df -h .

      - name: Cache build artifacts (kernel xcframework / gomobile / venv)
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/go/pkg/mod
          key: hako-build-${{ runner.os }}-${{ hashFiles('Dependencies.lock.json') }}
          restore-keys: |
            hako-build-${{ runner.os }}-

      - name: Bootstrap pinned SDK and Adapter
        # 克隆钉住的内核/适配器源码，装钉住的 gomobile，编五切片 xcframework
        run: .build/python-env/bin/python3 scripts/bootstrap.py

      - name: Generate Xcode project
        run: .build/python-env/bin/python3 scripts/configure.py

      - name: Build HakoClient (unsigned, iOS Simulator)
        # ⚠️ pipefail + 逐 target：之前 xcodebuild|tee 吞掉失败退出码，
        # 编译错误被静默标 success（2026-10-13 踩坑，掩盖了 EC 层 27 条错误）。
        run: |
          set -uo pipefail
          XCB=(xcodebuild -project apple/HakoClient/HakoClient.xcodeproj \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO)
          rm -f /tmp/xc.log
          for T in HakoClient HakoClientExtension HakoControlsExtension HakoShareExtension; do
            echo "===== building target $T =====" >> /tmp/xc.log
            "${XCB[@]}" -target "$T" build >> /tmp/xc.log 2>&1 || echo "target $T FAILED" >> /tmp/xc.log
          done
          ERRORS=$(grep -E ' error:' /tmp/xc.log | sed 's/^[0-9T:.Z-]* *//' | sort -u)
          if [ -n "$ERRORS" ]; then
            echo "=== 全部编译错误（$(echo "$ERRORS" | wc -l | tr -d ' ') 条）==="
            echo "$ERRORS"
            exit 1
          fi
          echo "构建通过"
          tail -5 /tmp/xc.log

  # HakoAgentKit：纯逻辑协议包的 swift test（Linux runner 即可，swift-crypto 跨平台）
  swift-test:
    name: swift-test (HakoAgentKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: swift test (HakoAgentKit)
        working-directory: apple/HakoAgentKit
        run: swift test
