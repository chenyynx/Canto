name: CI
on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译验证：模拟器免签名构建，证明这份源码树能完整编过。
  # 安装到真机需要自己的证书与描述文件，不在 CI 内做。
  build:
    name: build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # README 要求 Xcode 27；runner 默认版本随时间漂移，这里显式选最高版本。
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          CANDIDATE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CANDIDATE" ]; then echo "no Xcode on this runner"; exit 1; fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          # 与 Dependencies.lock.json 所钉内核 bind/clash/go.mod 的 toolchain 指令一致。
          # 低于该版本时 Go 会把 toolchain 下到 GOMODCACHE，build_libbox 拒绝在
          # GOMODCACHE 下做覆盖，Apple 切片全部失败（2026-10-24 CI 实踩）。
          go-version: '1.26.10'

      - name: Install XcodeGen and PyYAML
        # runner 的 Homebrew Python 是 externally-managed，pip 直装会被拒；
        # 按项目 README 的约定用 .build/python-env 虚拟环境。
        run: |
          brew install xcodegen
          python3 -m venv .build/python-env
          .build/python-env/bin/pip install --upgrade PyYAML
          xcodegen --version
          df -h .

      - name: Cache build artifacts (kernel xcframework / gomobile / venv)
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/go/pkg/mod
          # key 必须带 Debug：配置不同，dd-sim 的编译产物不能混用；而 actions/cache
          # 命中主 key 时不会重存，混用会导致 Debug 产物永远存不进去（2026-10-25 实测）。
          # restore-keys 回退到不带配置的旧 key，保证内核 xcframework 仍能复用。
          key: canto-build-${{ runner.os }}-debug-${{ hashFiles('Dependencies.lock.json') }}
          restore-keys: |
            canto-build-${{ runner.os }}-

      - name: Bootstrap pinned SDK and Adapter
        # 克隆钉住的内核/适配器源码，装钉住的 gomobile，编五切片 xcframework
        run: .build/python-env/bin/python3 scripts/bootstrap.py

      - name: Generate Xcode project
        run: .build/python-env/bin/python3 scripts/configure.py

      - name: Resolve SwiftPM packages
        # CantoAgentKit 经本地包依赖 swift-crypto；xcodebuild 不总是自动解析传递依赖，
        # 显式跑一次确保 Crypto 模块可构建（2026-10-14 修 CI 实踩）。
        run: |
          xcodebuild -project apple/ClashClient/ClashClient.xcodeproj -resolvePackageDependencies

      - name: Build ClashiOS (unsigned, iOS Simulator)
        # ⚠️ 判成败只看退出码。历史踩坑：①xcodebuild|tee 吞掉退出码致假绿（2026-10-13）；
        # ②grep 匹配错误文本判失败，零错误（=构建成功）时 grep 无匹配 + pipefail + set -e
        #   令脚本静默 exit 1 致假失败（2026-10-14 实踩）。失败时打印错误摘要 + 日志尾部，
        #   完整 xc.log 由下一步上传 artifact 供取证。
        # ⚠️ 不要给主 target（ClashiOS）加逐 target 构建：`xcodebuild -target` 对消费嵌套
        #   本地包的 target（ClashiOS→ClashClientUI→ClashClientKit）有模块解析
        #   缺陷，恒报 unable to resolve module dependency（2026-10-14 实测：同代码 scheme 全绿、
        #   -target 必红）。主 target 编译由 scheme 构建权威覆盖；扩展 target 无嵌套包依赖，
        #   保留逐 target 构建（scheme 早失败时仍可独立验证扩展）。
        run: |
          set -uo pipefail
          DEST='generic/platform=iOS Simulator'
          # 门禁用 Debug：Release + WMO 在 3 vCPU runner 上即使命中缓存也要 ~28 分钟
          # （2026-10-25 实测 1668s），增量几乎不生效。Debug 只验证"能编过"，
          # Release/真机产物由 unsigned-ipa.yml 的打包流程验证。
          # ARCHS=arm64 + ONLY_ACTIVE_ARCH：generic Simulator 默认编 arm64+x86_64，
          # 砍掉 x86_64 省一半编译量；只影响 CI，本地/真机不受影响。
          SCHEME_ARGS=(xcodebuild -project apple/ClashClient/ClashClient.xcodeproj \
            -scheme ClashiOS -configuration Debug -destination "$DEST" \
            -derivedDataPath .build/dd-sim \
            CANTO_BUILD_REVISION="$(git rev-parse --short HEAD)" CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES)
          TARGET_ARGS=(xcodebuild -project apple/ClashClient/ClashClient.xcodeproj \
            -configuration Debug -destination "$DEST" CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES)
          rm -f /tmp/xc.log
          FAILED=0
          run_build () {
            LABEL="$1"; shift
            echo "===== $LABEL =====" >> /tmp/xc.log
            if "$@" >> /tmp/xc.log 2>&1; then
              echo "PASS: $LABEL"
            else
              echo "FAIL: $LABEL"
              FAILED=$((FAILED + 1))
            fi
          }
          run_build "scheme build" "${SCHEME_ARGS[@]}" build
          # 不再逐 target 编 ClashiOSExtension：它直接链接 swift-crypto/_CryptoExtras，
          # `-target` 模式下 Xcode 26.6 不把 SwiftASN1 的模块路径接进 swiftc，
          # 恒报 unable to resolve module dependency（2026-10-25 实踩）。
          # scheme 构建已包含该扩展（ClashiOS 依赖它），权威覆盖由上面那次构建提供。
          for T in ClashControlsExtension ClashShareExtension; do
            run_build "target $T" "${TARGET_ARGS[@]}" -target "$T" build
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "===== 构建失败（$FAILED 处）——错误摘要 ====="
            { grep -a ' error:' /tmp/xc.log || true; } | sed 's/^[0-9T:.Z-]* *//' | sort -u | head -100 || true
            echo "===== xc.log 末尾 80 行 ====="
            tail -80 /tmp/xc.log || true
            exit 1
          fi
          echo "构建通过"

      - name: swift test (ClashClientUI)
        # 纯逻辑单测（快捷方式持久化等）；同时编译 macOS 分支，
        # 让 CI 能发现只在 macOS 条件编译里出现的 API 问题。
        run: swift test --package-path apple/ClashClientUI

      - name: swift build (ClashMacClient)
        # Mac 外壳不在 Xcode 主工程里，单独编一次，避免 Mac 线悄悄腐烂。
        run: swift build --package-path apple/ClashMacClient

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: /tmp/xc.log
          if-no-files-found: ignore
          retention-days: 7

  # CantoAgentKit：纯逻辑协议包的 swift test（Linux runner 即可，swift-crypto 跨平台）
  swift-test:
    name: swift-test (CantoAgentKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Validate localization tables
        run: python3 scripts/check_localization.py
      - name: swift test (CantoAgentKit)
        working-directory: apple/CantoAgentKit
        run: swift test
