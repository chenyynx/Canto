name: CI
on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译验证：模拟器免签名构建，证明这份源码树能完整编过。
  # 安装到真机需要自己的证书与描述文件，不在 CI 内做。
  build:
    name: build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # README 要求 Xcode 27；runner 默认版本随时间漂移，这里显式选最高版本。
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          CANDIDATE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CANDIDATE" ]; then echo "no Xcode on this runner"; exit 1; fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          # 与 Dependencies.lock.json 所钉内核的 go.mod 工具链指令一致
          go-version: '1.26.6'

      - name: Install XcodeGen and PyYAML
        # runner 的 Homebrew Python 是 externally-managed，pip 直装会被拒；
        # 按项目 README 的约定用 .build/python-env 虚拟环境。
        run: |
          brew install xcodegen
          python3 -m venv .build/python-env
          .build/python-env/bin/pip install --upgrade PyYAML
          xcodegen --version
          df -h .

      - name: Cache build artifacts (kernel xcframework / gomobile / venv)
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/go/pkg/mod
          key: hako-build-${{ runner.os }}-${{ hashFiles('Dependencies.lock.json') }}
          restore-keys: |
            hako-build-${{ runner.os }}-

      - name: Bootstrap pinned SDK and Adapter
        # 克隆钉住的内核/适配器源码，装钉住的 gomobile，编五切片 xcframework
        run: .build/python-env/bin/python3 scripts/bootstrap.py

      - name: Generate Xcode project
        run: .build/python-env/bin/python3 scripts/configure.py

      - name: Resolve SwiftPM packages
        # HakoAgentKit 经本地包依赖 swift-crypto；xcodebuild 不总是自动解析传递依赖，
        # 显式跑一次确保 Crypto 模块可构建（2026-10-14 修 CI 实踩）。
        run: |
          xcodebuild -project apple/HakoClient/HakoClient.xcodeproj -resolvePackageDependencies

      - name: Build HakoClient (unsigned, iOS Simulator)
        # ⚠️ 判成败只看退出码。历史两次踩坑：①xcodebuild|tee 吞掉退出码致假绿（2026-10-13）；
        # ②grep 匹配错误文本判失败，零错误（=构建成功）时 grep 无匹配 + pipefail + set -e
        #   令脚本静默 exit 1 致假失败（2026-10-14 实踩）。失败时打印错误摘要 + 日志尾部，
        #   完整 xc.log 由下一步上传 artifact 供取证。
        run: |
          set -uo pipefail
          DEST='generic/platform=iOS Simulator'
          SCHEME_ARGS=(xcodebuild -project apple/HakoClient/HakoClient.xcodeproj \
            -scheme HakoClient -configuration Release -destination "$DEST" \
            -derivedDataPath .build/dd-sim CODE_SIGNING_ALLOWED=NO)
          TARGET_ARGS=(xcodebuild -project apple/HakoClient/HakoClient.xcodeproj \
            -configuration Release -destination "$DEST" CODE_SIGNING_ALLOWED=NO)
          rm -f /tmp/xc.log
          FAILED=0
          run_build () {
            LABEL="$1"; shift
            echo "===== $LABEL =====" >> /tmp/xc.log
            if "$@" >> /tmp/xc.log 2>&1; then
              echo "PASS: $LABEL"
            else
              echo "FAIL: $LABEL"
              FAILED=$((FAILED + 1))
            fi
          }
          run_build "scheme build" "${SCHEME_ARGS[@]}" build
          for T in HakoClient HakoClientExtension HakoControlsExtension HakoShareExtension; do
            run_build "target $T" "${TARGET_ARGS[@]}" -target "$T" build
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "===== 构建失败（$FAILED 处）——错误摘要 ====="
            { grep -a ' error:' /tmp/xc.log || true; } | sed 's/^[0-9T:.Z-]* *//' | sort -u | head -100 || true
            echo "===== xc.log 末尾 80 行 ====="
            tail -80 /tmp/xc.log || true
            exit 1
          fi
          echo "构建通过"

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: /tmp/xc.log
          if-no-files-found: ignore
          retention-days: 7

  # HakoAgentKit：纯逻辑协议包的 swift test（Linux runner 即可，swift-crypto 跨平台）
  swift-test:
    name: swift-test (HakoAgentKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: swift test (HakoAgentKit)
        working-directory: apple/HakoAgentKit
        run: swift test
