name: Unsigned IPA

# 未签名真机 IPA 打包：供 全能签 / SideStore 等侧载工具在设备上重签安装。
# 手动触发（workflow_dispatch）；产物为 artifact，保留 7 天。
on:
  workflow_dispatch:
    inputs:
      bundle_base:
        description: 'Bundle id 前缀（默认 org.example.canto）'
        required: false
        default: 'org.example.canto'

jobs:
  ipa:
    name: package (unsigned)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          CANDIDATE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$CANDIDATE" ]; then echo "no Xcode on this runner"; exit 1; fi
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          # 与 Dependencies.lock.json 所钉内核 bind/clash/go.mod 的 toolchain 一致
          go-version: '1.26.10'

      - name: Restore build cache (kernel xcframework / gomobile / venv)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/go/pkg/mod
          key: canto-build-${{ runner.os }}-${{ hashFiles('Dependencies.lock.json') }}
          restore-keys: |
            canto-build-${{ runner.os }}-

      - name: Install XcodeGen and PyYAML
        run: |
          brew install xcodegen
          python3 -m venv .build/python-env
          .build/python-env/bin/pip install --upgrade PyYAML

      - name: Bootstrap pinned SDK and Adapter
        run: .build/python-env/bin/python3 scripts/bootstrap.py

      - name: Save build cache (always — 失败也要留住内核产物)
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            .build
            ~/go/pkg/mod

      - name: Generate Xcode project
        run: |
          .build/python-env/bin/python3 scripts/configure.py \
            --bundle-base "${{ github.event.inputs.bundle_base }}"

      - name: Resolve SwiftPM packages
        # 与 ci.yml 同：显式解析一次，确保本地包（ClashClientUI→ClashClientKit、CantoAgentKit）依赖就绪
        run: |
          xcodebuild -project apple/ClashClient/ClashClient.xcodeproj -resolvePackageDependencies

      - name: Build for device (unsigned)
        # ⚠️ 判成败只看退出码（与 ci.yml 同规）。旧版用 grep 文本判空：零编译错误（=成功）时
        #   grep 无匹配 + pipefail + set -e 会静默 exit 1；错误全被 grep -v 过滤时中途管道
        #   退出码同样触发死法——该写法没有任何成功出口（2026-10-14 实踩，17 次全红）。
        # ⚠️ 不逐 target 构建 ClashiOS：`xcodebuild -target` 对嵌套本地包 target 有模块解析
        #   缺陷（恒报 unable to resolve module dependency 假错误），其编译由 scheme 构建权威
        #   覆盖；扩展 target 无嵌套包依赖，可安全逐 target 构建。
        # ⚠️ Xcode 26.6 默认开启 explicitly built modules，真机（iphoneos）构建下会解析不到
        #   SwiftPM 包内部依赖（swift-crypto/_CryptoExtras 报 unable to resolve module
        #   dependency: 'SwiftASN1'；模拟器不触发）。Swift Forums 80516 有同类记录，
        #   打包这里显式关闭（2026-10-25 实踩）。
        run: |
          set -uo pipefail
          SCHEME_ARGS=(xcodebuild -project apple/ClashClient/ClashClient.xcodeproj \
            -scheme ClashiOS -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/dd \
            CANTO_BUILD_REVISION="$(git rev-parse --short HEAD)" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO)
          TARGET_ARGS=(xcodebuild -project apple/ClashClient/ClashClient.xcodeproj \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO)
          rm -f /tmp/xc.log
          FAILED=0
          run_build () {
            LABEL="$1"; shift
            echo "===== $LABEL =====" >> /tmp/xc.log
            if "$@" >> /tmp/xc.log 2>&1; then
              echo "PASS: $LABEL"
            else
              echo "FAIL: $LABEL"
              FAILED=$((FAILED + 1))
            fi
          }
          # ① scheme 构建：成功即产出 .app；失败不中断（继续收集）
          run_build "scheme build" "${SCHEME_ARGS[@]}" build
          # ② 逐 target 构建：把每个扩展 target 的错误都收进来（-keepGoing 在本版本不可用）
          #    ClashiOSExtension 不在此列：它直接链接 swift-crypto/_CryptoExtras，`-target`
          #    模式下 Xcode 26.6 不把 SwiftASN1 的模块路径接进 swiftc；scheme 构建已包含它
          #    （2026-10-25 真机打包实踩，与 ci.yml 同一缺陷）。
          for T in ClashControlsExtension ClashShareExtension; do
            run_build "target $T" "${TARGET_ARGS[@]}" -target "$T" build
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "===== 构建失败（$FAILED 处）——错误摘要 ====="
            { grep -a ' error:' /tmp/xc.log || true; } | sed 's/^[0-9T:.Z-]* *//' | sort -u | head -100 || true
            echo "===== xc.log 末尾 80 行 ====="
            tail -80 /tmp/xc.log || true
            exit 1
          fi
          echo "=== 无编译错误，产物： ==="
          APP=$(find .build/dd/Build/Products -maxdepth 2 -name "*.app" 2>/dev/null | head -1 || true)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物（构建通过但产物缺失，需检查）"
            exit 1
          fi
          echo "$APP"

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: /tmp/xc.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find .build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          # 未签名包：清掉可能残留的签名目录（侧载工具会重签）
          rm -rf /tmp/ipa/Payload/*.app/_CodeSignature || true
          cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/Canto-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/Canto-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Canto-unsigned.ipa" | head -20
          echo "--- 嵌套扩展 ---"
          unzip -l "$GITHUB_WORKSPACE/Canto-unsigned.ipa" | grep -E '\.appex' | head

      - uses: actions/upload-artifact@v4
        with:
          name: Canto-unsigned-ipa
          path: Canto-unsigned.ipa
          retention-days: 7
